name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == "latest" ]] || ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 必须是语义化版本（X.Y.Z）且不能为 latest，当前：${tag}" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build deploy-agent
        env:
          GOTOOLCHAIN: auto
          GOOS: linux
          GOARCH: amd64
        run: make build VERSION="${GITHUB_REF_NAME}"

      - name: generate sha256 checksum
        run: |
          cd bin
          sha256sum deploy-agent > deploy-agent.sha256

      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" bin/deploy-agent bin/deploy-agent.sha256 --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" bin/deploy-agent bin/deploy-agent.sha256 \
              --title "$tag" \
              --notes "deploy-agent ${tag}" \
              --latest
          fi

      - name: verify uploaded artifacts
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"
          tmp="$(mktemp -d)"
          ok=0
          for _ in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
              -o "${tmp}/deploy-agent" "${base}/deploy-agent" \
              && curl --fail --silent --show-error --location \
              -o "${tmp}/deploy-agent.sha256" "${base}/deploy-agent.sha256"; then
              ok=1
              break
            fi
            sleep 2
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "下载已发布附件失败：${base}" >&2
            exit 1
          fi
          expected="$(awk '{print $1}' "${tmp}/deploy-agent.sha256")"
          actual="$(sha256sum "${tmp}/deploy-agent" | awk '{print $1}')"
          local_sum="$(sha256sum bin/deploy-agent | awk '{print $1}')"
          if [[ "$actual" != "$expected" || "$actual" != "$local_sum" ]]; then
            echo "checksum mismatch: local ${local_sum}, downloaded ${actual}, file ${expected}" >&2
            exit 1
          fi
          echo "sha256 ok: ${actual}"
